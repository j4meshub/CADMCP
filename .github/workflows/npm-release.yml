name: npm 发布
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: "https://registry.npmjs.org", cache: npm, cache-dependency-path: server/package-lock.json }
      - name: 校验统一版本和 Release Tag
        shell: pwsh
        run: |
          ./scripts/test-version-consistency.ps1
          $version = (Get-Content ./version.json -Raw | ConvertFrom-Json).productVersion
          if ("${{ github.event.release.tag_name }}" -ne "v$version") { throw "Release Tag 必须为 v$version" }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          CADMCP_REQUIRE_GIT_SHA: "1"
      - run: npm publish --access public --provenance
        working-directory: server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CADMCP_REQUIRE_GIT_SHA: "1"
